name: Build KSUN + SUSFS (SM-M146B DZI1)

on:
  workflow_dispatch:
    inputs:
      ksu_mode:
        description: 'KSUN mode: susfs (auto-fallback if Samsung fs conflicts) or kprobe (guaranteed clean)'
        required: false
        default: 'susfs'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libelf-dev bc bison flex libssl-dev make zip lz4 cpio wget jq python3 pahole device-tree-compiler libc6-dev linux-libc-dev rsync

      - name: Download Android Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://googlesource.com
          tar -xzf clang-r450784e.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: Download Source & Boot Assets from Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/assets $GITHUB_WORKSPACE/kernel $GITHUB_WORKSPACE/repack
          gh release download v1.0 -D $GITHUB_WORKSPACE/assets

          cd $GITHUB_WORKSPACE/repack
          MAGISK_URL=$(curl -s https://github.com | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          wget -q "$MAGISK_URL" -O magisk.zip
          unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d ./
          mv libmagiskboot.so magiskboot && chmod +x magiskboot

      - name: Extract Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel
          tar -xzf $GITHUB_WORKSPACE/assets/Kernel.tar.gz

      - name: Prepare Kernel Environment
        run: |
          cd $GITHUB_WORKSPACE/kernel
          if [ -d "kernel-5.15/drivers" ]; then cd kernel-5.15; elif [ -d "common/drivers" ]; then cd common; fi
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

          if [ -f "scripts/setlocalversion" ]; then
            sed -i 's/ -dirty//g; s/-dirty//g; s/echo "+"/echo ""/g' scripts/setlocalversion || true
          fi

          sed -i 's|^CROSS_COMPILE.*=.*|CROSS_COMPILE ?= aarch64-linux-gnu-|g' Makefile || true
          sed -i 's|^CC.*=.*|CC ?= clang|g' Makefile || true

          rsync -a fs/ $GITHUB_WORKSPACE/backup_fs/
          rsync -a include/ $GITHUB_WORKSPACE/backup_include/

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd $KERNEL_DIR
          USE_SUSFS="false"
          if [ "${{ github.event.inputs.ksu_mode }}" = "susfs" ]; then
            git clone --depth=1 https://gitlab.com -b gki-android13-5.15 $GITHUB_WORKSPACE/susfs4ksu
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* ./fs/
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* ./include/linux/
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ./

            if patch -p1 --fuzz=3 --forward < 50_add_susfs_in_gki-android13-5.15.patch; then
              echo "SUCCESS: SUSFS patch applied cleanly!"
              USE_SUSFS="true"
              curl -LSs "https://githubusercontent.com" | bash -s dev-susfs
            else
              echo "=== FALLBACK: SUSFS failed, using clean source Kprobe Mode ==="
              rsync -a --delete $GITHUB_WORKSPACE/backup_fs/ fs/
              rsync -a --delete $GITHUB_WORKSPACE/backup_include/ include/
              find . -name "*.rej" -delete
              find . -name "*.orig" -delete
              curl -LSs "https://githubusercontent.com" | bash -s next
            fi
          else
            curl -LSs "https://githubusercontent.com" | bash -s next
          fi
          echo "USE_SUSFS=$USE_SUSFS" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/repack
          cp $GITHUB_WORKSPACE/assets/stock_boot.img ./boot.img
          ./magiskboot unpack boot.img
          STOCK_VER=$(strings kernel | grep -oE "^5\.15\.[0-9]+-android13-[0-9]+-[0-9a-zA-Z_-]+" | head -n 1 | sed -E 's/^5\.15\.[0-9]+//' || echo "-android13-3-31192385")

          cd $KERNEL_DIR
          DEFCONFIG=$(ls arch/arm64/configs/*m14* arch/arm64/configs/*8535* 2>/dev/null | head -n 1 | xargs basename || echo "s5e8535-m14xnsxx_defconfig")

          cat << 'KCFG' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_SECURITY_DEFEX=n
          CONFIG_UH=n
          CONFIG_RKP=n
          CONFIG_KDP=n
          CONFIG_PROCA=n
          CONFIG_FIVE=n
          CONFIG_INTEGRITY=n
          CONFIG_TRIM_UNUSED_KSYMS=n
          CONFIG_WERROR=n
          KCFG

          if [ "$USE_SUSFS" = "true" ]; then
            cat << 'SCFG' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          SCFG
          fi

          export PLATFORM_VERSION=13
          export TARGET_SOC=s5e8535

          MAKE_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1"
          make $MAKE_ARGS $DEFCONFIG

          ./scripts/config --file out/.config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -d SECURITY_DEFEX -d UH -d RKP -d KDP -d PROCA -d FIVE -d INTEGRITY -d TRIM_UNUSED_KSYMS -d WERROR \
            --set-str LOCALVERSION "$STOCK_VER"

          if [ "$USE_SUSFS" = "true" ]; then
            ./scripts/config --file out/.config -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_OPEN_REDIRECT
          fi

          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS KCFLAGS="-Wno-error" -j$(nproc --all) Image

      - name: Repack Flashable TAR
        run: |
          cd $GITHUB_WORKSPACE/repack
          cp $KERNEL_DIR/out/arch/arm64/boot/Image ./kernel
          ./magiskboot repack boot.img new-boot.img
          lz4 -B6 --content-size -f new-boot.img boot.img.lz4
          cp $GITHUB_WORKSPACE/assets/vbmeta.img.lz4 ./vbmeta.img.lz4
          tar -H ustar -cf KSUN_SUSFS_M146B_DZI1.tar boot.img.lz4 vbmeta.img.lz4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSUN_SUSFS_M146B_DZI1
          path: ${{ github.workspace }}/repack/KSUN_SUSFS_M146B_DZI1.tar
