name: Build KSUN + SUSFS (SM-M146B DZI1)

on:
  workflow_dispatch:
    inputs:
      ksu_mode:
        description: 'KSUN mode: susfs (auto-fallback if Samsung fs conflicts) or kprobe (guaranteed clean)'
        required: false
        default: 'susfs'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential clang lld llvm binutils-aarch64-linux-gnu libelf-dev bc bison flex libssl-dev make zip lz4 cpio wget curl jq python3 pahole device-tree-compiler rsync ca-certificates git

      - name: Download Source & Boot Assets from Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/assets $GITHUB_WORKSPACE/kernel $GITHUB_WORKSPACE/repack
          gh release download v1.0 -D $GITHUB_WORKSPACE/assets

          cd $GITHUB_WORKSPACE/repack
          gh release download --repo topjohnwu/Magisk -p "Magisk-*.apk" -O magisk.zip
          unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d ./
          mv libmagiskboot.so magiskboot && chmod +x magiskboot

      - name: Extract Kernel Source
        run: |
          cd $GITHUB_WORKSPACE/kernel
          tar -xzf $GITHUB_WORKSPACE/assets/Kernel.tar.gz

      - name: Prepare Kernel Environment
        run: |
          cd $GITHUB_WORKSPACE/kernel
          if [ -d "kernel-5.15/drivers" ]; then cd kernel-5.15; elif [ -d "common/drivers" ]; then cd common; fi
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

          if [ -f "scripts/setlocalversion" ]; then
            sed -i 's/ -dirty//g; s/-dirty//g; s/echo "+"/echo ""/g' scripts/setlocalversion || true
          fi


          rsync -a fs/ $GITHUB_WORKSPACE/backup_fs/
          rsync -a include/ $GITHUB_WORKSPACE/backup_include/

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd $KERNEL_DIR
          USE_SUSFS="false"
          if [ "${{ github.event.inputs.ksu_mode }}" = "susfs" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 $GITHUB_WORKSPACE/susfs4ksu
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* ./fs/
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* ./include/linux/
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ./

            chmod -R +w .
  patch -p1 --fuzz=3 --forward < 50_add_susfs_in_gki-android13-5.15.patch || true
            if [ -f fs/namespace.c.rej ]; then
              python3 -c 's=open("fs/namespace.c").read(); s=s.replace("#include <linux/mnt_idmapping.h>","#include <linux/mnt_idmapping.h>\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif",1); s=s.replace("#include <trace/hooks/blk.h>","#include <trace/hooks/blk.h>\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n#endif",1); open("fs/namespace.c","w").write(s)'
              rm -f fs/namespace.c.rej
            fi
            if [ "$(find . -name '*.rej' | wc -l)" -eq 0 ]; then
              echo "SUCCESS: SUSFS patch applied cleanly!"
              USE_SUSFS="true"
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s next-susfs
            else
              echo "=== FALLBACK: SUSFS failed, using clean source Kprobe Mode ==="
              rsync -a --delete $GITHUB_WORKSPACE/backup_fs/ fs/
              rsync -a --delete $GITHUB_WORKSPACE/backup_include/ include/
              find . -name "*.rej" -delete
              find . -name "*.orig" -delete
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
            fi
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
          fi
          echo "USE_SUSFS=$USE_SUSFS" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/repack
          cp $GITHUB_WORKSPACE/assets/stock_boot.img ./boot.img
          ./magiskboot unpack boot.img
          STOCK_VER=$(strings kernel | grep -oE "5\.15\.[0-9]+-android13-[0-9]+-[0-9a-zA-Z_-]+" | head -n 1 | sed -E 's/^5\.15\.[0-9]+//' || echo "-android13-3-31192385")
          echo "Detected STOCK_VER: $STOCK_VER"

          cd $KERNEL_DIR
          DEFCONFIG=$(ls arch/arm64/configs/*m14* arch/arm64/configs/*8535* 2>/dev/null | head -n 1 | xargs basename || echo "s5e8535-m14xnsxx_defconfig")
          echo "Using DEFCONFIG: $DEFCONFIG"

          cat << 'KCFG' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_SECURITY_DEFEX=n
          CONFIG_UH=n
          CONFIG_UH_RKP=n
          CONFIG_UH_LKMAUTH=n
          CONFIG_UH_LKM_BLOCK=n
          CONFIG_RKP=n
          CONFIG_RKP_CFP=n
          CONFIG_RKP_CFP_JOPP=n
          CONFIG_KDP=n
          CONFIG_KDP_CRED=n
          CONFIG_KDP_NS=n
          CONFIG_PROCA=n
          CONFIG_FIVE=n
          CONFIG_INTEGRITY=n
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n
          CONFIG_TRIM_UNUSED_KSYMS=n
          CONFIG_WERROR=n
          KCFG

          if [ "$USE_SUSFS" = "true" ]; then
            cat << 'SCFG' >> arch/arm64/configs/$DEFCONFIG
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          SCFG
          fi

          export PLATFORM_VERSION=13
          export TARGET_SOC=s5e8535

          mkdir -p $GITHUB_WORKSPACE/clang
          curl -fLsS "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r450784e.tar.gz" | tar -xz -C $GITHUB_WORKSPACE/clang
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version

          MAKE_ARGS=(O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-)
          make "${MAKE_ARGS[@]}" $DEFCONFIG

          ./scripts/config --file out/.config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -d SECURITY_DEFEX -d UH -d UH_RKP -d UH_LKMAUTH -d UH_LKM_BLOCK \
            -d RKP -d RKP_CFP -d RKP_CFP_JOPP -d KDP -d KDP_CRED -d KDP_NS \
            -d PROCA -d FIVE -d INTEGRITY -d MODULE_SIG -d MODULE_SIG_FORCE \
            -d TRIM_UNUSED_KSYMS -d WERROR \
            --set-str LOCALVERSION "$STOCK_VER"

          if [ "$USE_SUSFS" = "true" ]; then
            ./scripts/config --file out/.config -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_OPEN_REDIRECT
          fi

          make "${MAKE_ARGS[@]}" olddefconfig
          make "${MAKE_ARGS[@]}" KCFLAGS="-Wno-error" -j$(nproc --all) Image

      - name: Repack Flashable TAR
        run: |
          cd $GITHUB_WORKSPACE/repack
          tar -H ustar -cf STOCK_BOOT_M146B_DZI1.tar boot.img
          cp $KERNEL_DIR/out/arch/arm64/boot/Image ./kernel
          ./magiskboot repack boot.img new-boot.img
          mv new-boot.img boot.img
          tar -H ustar -cf KSUN_SUSFS_M146B_DZI1.tar boot.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSUN_SUSFS_M146B_DZI1
          path: |
            ${{ github.workspace }}/repack/KSUN_SUSFS_M146B_DZI1.tar
            ${{ github.workspace }}/repack/STOCK_BOOT_M146B_DZI1.tar
