name: Build KSUN + SUSFS (SM-M146B DZI1)

on:
  workflow_dispatch:
    inputs:
      ksu_mode:
        description: 'KSUN mode: susfs or kprobe'
        required: false
        default: 'susfs'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Up Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 pahole \
            device-tree-compiler lz4 cpio wget jq binutils clang lld llvm

      - name: Download Source & Boot Assets from Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p $GITHUB_WORKSPACE/assets $GITHUB_WORKSPACE/kernel
          gh release download v1.0 -D $GITHUB_WORKSPACE/assets
          ls -lh $GITHUB_WORKSPACE/assets

      - name: Inspect Stock DZI1 boot.img & Extract Exact Vermagic
        run: |
          mkdir -p $GITHUB_WORKSPACE/repack && cd $GITHUB_WORKSPACE/repack
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          wget -q "$MAGISK_URL" -O magisk.zip
          unzip -j magisk.zip "lib/x86_64/libmagiskboot.so" -d ./
          mv libmagiskboot.so magiskboot && chmod +x magiskboot

          cp $GITHUB_WORKSPACE/assets/stock_boot.img ./boot.img
          ./magiskboot unpack boot.img

          FULL_VER=$(strings kernel | grep -oE "^5\.15\.[0-9]+-android13-[0-9]+-[0-9a-zA-Z_-]+" | head -n 1 || true)
          echo "Detected Stock DZI1 Kernel Version: $FULL_VER"
          LOCAL_VER=$(echo "$FULL_VER" | sed -E 's/^5\.15\.[0-9]+//')
          if [ -z "$LOCAL_VER" ]; then
            LOCAL_VER="-android13-3-31192385"
          fi
          echo "Using LOCAL_VER: $LOCAL_VER"
          echo "STOCK_LOCALVER=$LOCAL_VER" >> $GITHUB_ENV

      - name: Extract Kernel.tar.gz
        run: |
          cd $GITHUB_WORKSPACE/kernel
          tar -xzf $GITHUB_WORKSPACE/assets/Kernel.tar.gz
          ls -la

      - name: Setup Toolchain Paths
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain

          mkdir -p clang/host/linux-x86/clang-r450784d
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz -O clang.tar.gz || \
          wget -q https://github.com/chenxiaolong/CPH-Kernel-Definer/releases/download/tools/clang-r450784d.tar.gz -O clang.tar.gz
          
          if [ -f clang.tar.gz ]; then
            tar -xzf clang.tar.gz -C clang/host/linux-x86/clang-r450784d
            rm -f clang.tar.gz
          else
            git clone --depth=1 https://github.com/droidian/android-platform-prebuilts-clang-host-linux-x86-33 clang-mirror
            mv clang-mirror/clang-r450784d/* clang/host/linux-x86/clang-r450784d/
            rm -rf clang-mirror
          fi

          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-12.1.0_r27 gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/build-tools -b android-13.0.0_r24 build/kernel/build-tools
          git clone --depth=1 https://android.googlesource.com/kernel/prebuilts/build-tools -b android13-5.15 prebuilts/kernel-build-tools || true
          mkdir -p build/kernel/build-tools/sysroot

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel
          if [ -d "kernel-5.15/drivers" ]; then
            cd kernel-5.15
          elif [ -d "common/drivers" ]; then
            cd common
          fi
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

          if [ -f "scripts/setlocalversion" ]; then
            sed -i 's/ -dirty//g; s/-dirty//g; s/echo "+"/echo ""/g' scripts/setlocalversion || true
          fi

          if [ "${{ github.event.inputs.ksu_mode }}" = "susfs" ]; then
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs || \
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 $GITHUB_WORKSPACE/susfs4ksu
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* ./fs/
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* ./include/linux/
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ./
            patch -p1 --forward < 50_add_susfs_in_gki-android13-5.15.patch || true
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi

      - name: Compile Kernel with Native HOSTCC
        run: |
          cd $KERNEL_DIR
          
          TARGET_CFG="arch/arm64/configs/s5e8535-m14xnsxx_defconfig"
          cat << 'KCFG' >> "$TARGET_CFG"
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          CONFIG_SECURITY_DEFEX=n
          CONFIG_UH=n
          CONFIG_RKP=n
          CONFIG_KDP=n
          CONFIG_PROCA=n
          CONFIG_FIVE=n
          CONFIG_INTEGRITY=n
          CONFIG_TRIM_UNUSED_KSYMS=n
          KCFG

          TC="$GITHUB_WORKSPACE/toolchain"
          export PLATFORM_VERSION=13
          export PATH="$TC/clang/host/linux-x86/clang-r450784d/bin:$PATH"
          export TARGET_SOC=s5e8535
          export ARCH=arm64
          export CROSS_COMPILE="$TC/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-"

          # Force native gcc for host tools (fixdep) to solve missing sys/types.h
          make s5e8535-m14xnsxx_defconfig HOSTCC=gcc HOSTCXX=g++

          ./scripts/config --file .config \
            -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS \
            -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_OPEN_REDIRECT \
            -d SECURITY_DEFEX -d UH -d RKP -d KDP -d PROCA -d FIVE -d INTEGRITY -d TRIM_UNUSED_KSYMS \
            --set-str LOCALVERSION "$STOCK_LOCALVER"

          make olddefconfig HOSTCC=gcc HOSTCXX=g++
          make -j$(nproc --all) LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++

      - name: Repack DZI1 boot.img & Build Brokkr TAR
        run: |
          cd $GITHUB_WORKSPACE/repack
          cp $GITHUB_WORKSPACE/kernel/**/arch/arm64/boot/Image ./kernel || cp arch/arm64/boot/Image ./kernel
          ./magiskboot unpack boot.img
          ./magiskboot repack boot.img new-boot.img

          lz4 -B6 --content-size -f new-boot.img boot.img.lz4
          cp $GITHUB_WORKSPACE/assets/vbmeta.img.lz4 ./vbmeta.img.lz4
          tar -H ustar -cf KSUN_SUSFS_M146B_DZI1.tar boot.img.lz4 vbmeta.img.lz4
          ls -lh KSUN_SUSFS_M146B_DZI1.tar

      - name: Upload Compiled Brokkr TAR
        uses: actions/upload-artifact@v4
        with:
          name: KSUN_SUSFS_M146B_DZI1
          path: ${{ github.workspace }}/repack/KSUN_SUSFS_M146B_DZI1.tar
