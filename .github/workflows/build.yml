name: Build KSUN + SUSFS (SM-M146B DZI1)

on:
  workflow_dispatch:
    inputs:
      ksu_mode:
        description: 'Select KernelSU Mode (susfs = Next + SUSFS, kprobe = Standard Next)'
        required: true
        default: 'susfs'
        type: choice
        options:
          - susfs
          - kprobe

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3 python-is-python3 git curl wget lz4 unzip zip cpio rsync

      - name: Download & Extract Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchains
          cd $GITHUB_WORKSPACE/toolchains
          git clone --depth=1 https://gitlab.com clang
          git clone --depth=1 https://github.com gcc64
          git clone --depth=1 https://github.com gcc32

      - name: Prepare Kernel Source
        run: |
          cd $GITHUB_WORKSPACE
          if [ -d "kernel" ]; then
            echo "Found extracted kernel directory."
          elif [ -f "Kernel.tar.gz" ]; then
            mkdir -p kernel && tar -xzf Kernel.tar.gz -C kernel
          else
            echo "ERROR: Neither kernel/ directory nor Kernel.tar.gz found!"
            exit 1
          fi
          cp -r kernel/fs $GITHUB_WORKSPACE/backup_fs
          cp -r kernel/include $GITHUB_WORKSPACE/backup_include

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd $GITHUB_WORKSPACE/kernel
          USE_SUSFS="false"
          if [ "${{ github.event.inputs.ksu_mode }}" = "susfs" ]; then
            git clone --depth=1 https://gitlab.com -b gki-android13-5.15 $GITHUB_WORKSPACE/susfs4ksu
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/* fs/
            cp -r $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/* include/linux/
            cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch .
            patch -p1 --fuzz=3 --forward < 50_add_susfs_in_gki-android13-5.15.patch || true
            if [ -f fs/namespace.c.rej ]; then
              python3 -c '
          s = open("fs/namespace.c").read()
          s = s.replace("#include <linux/mnt_idmapping.h>", "#include <linux/mnt_idmapping.h>\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif", 1)
          s = s.replace("#include <trace/hooks/blk.h>", "#include <trace/hooks/blk.h>\n\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n#endif", 1)
          open("fs/namespace.c", "w").write(s)
          '
              rm -f fs/namespace.c.rej
            fi
            if [ "$(find . -name '*.rej' | wc -l)" -eq 0 ]; then
              echo "SUCCESS: SUSFS patch applied cleanly!"
              USE_SUSFS="true"
              curl -LSs "https://githubusercontent.com" | bash -s next-susfs
            else
              echo "=== Remaining .rej files ==="
              find . -name "*.rej" -exec echo "=== FILE: {} ===" \; -exec cat {} \;
              exit 1
            fi
          else
            curl -LSs "https://githubusercontent.com" | bash -s dev
          fi
          echo "USE_SUSFS=$USE_SUSFS" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PLATFORM_VERSION=13
          export ANDROID_MAJOR_VERSION=t
          export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out ARCH=arm64 s5e8535-m14xnsxx_defconfig

          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_DEBUG \
            -d KSU_MANUAL_HOOK \
            -e KPROBES \
            -e HAVE_KPROBES \
            -e KPROBE_EVENTS \
            -e OVERLAY_FS \
            -d MODULE_SIG \
            -d MODULE_SIG_FORCE \
            -d MODVERSIONS \
            -d TRIM_UNUSED_KSYMS \
            -d PROCA \
            -d UH \
            -d RKP \
            -d KDP \
            -d SECURITY_DEFEX \
            -d INTEGRITY \
            -d FIVE

          if [ "$USE_SUSFS" = "true" ]; then
            ./scripts/config --file out/.config \
              -e KSU_SUSFS \
              -e KSU_SUSFS_HAS_MAGIC_MOUNT \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SUS_OVERLAYFS \
              -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -e KSU_SUSFS_SUS_SU
          fi

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          echo "=== VERIFYING KSU & SUSFS IN FINAL .CONFIG ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES" out/.config || true
          if [ "$USE_SUSFS" = "true" ]; then
            grep -q "CONFIG_KSU_SUSFS=y" out/.config || { echo "ERROR: CONFIG_KSU_SUSFS=y missing!"; exit 1; }
          fi

          make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

      - name: Repack Stock Boot Image with Magiskboot
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f "stock_boot.img" ]; then
            echo "ERROR: stock_boot.img not found in repository root!"
            exit 1
          fi
          mkdir -p magisk_tools && cd magisk_tools
          curl -sL "https://github.com" -o magisk.apk
          unzip -q magisk.apk "lib/x86_64/libmagiskboot.so"
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

          cd $GITHUB_WORKSPACE
          mkdir -p repack && cd repack
          cp $GITHUB_WORKSPACE/stock_boot.img boot.img
          $GITHUB_WORKSPACE/magisk_tools/magiskboot unpack boot.img
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image kernel
          $GITHUB_WORKSPACE/magisk_tools/magiskboot repack boot.img new-boot.img
          mv new-boot.img boot.img
          tar -cvf KSUN_SUSFS_M146B_DZI1.tar boot.img

      - name: Upload Odin Flashable Tar
        uses: actions/upload-artifact@v4
        with:
          name: KSUN_SUSFS_M146B_DZI1_Odin
          path: repack/KSUN_SUSFS_M146B_DZI1.tar
          